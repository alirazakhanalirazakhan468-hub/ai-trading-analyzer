<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trading Analyzer</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  width:92%;
  max-width:760px;
  margin:auto;
  padding:35px 0 50px;
}

h1{
  text-align:center;
  font-size:42px;
  margin:10px 0;
}

.subtitle{
  text-align:center;
  color:#9fb0c5;
  font-size:20px;
  margin-bottom:30px;
}

.card{
  background:#101f31;
  border:1px solid #29405a;
  border-radius:25px;
  padding:28px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:20px;
  font-weight:bold;
  margin-bottom:18px;
}

input[type=file]{
  width:100%;
  padding:18px;
  background:#1a3048;
  color:white;
  border-radius:15px;
  border:0;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#4b617a;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  margin-top:20px;
  border-radius:15px;
  display:none;
}

#status{
  text-align:center;
  margin-top:18px;
  color:#9fb0c5;
}

.result{
  white-space:pre-wrap;
  line-height:1.6;
  font-size:16px;
  background:#081522;
  border-radius:15px;
  padding:20px;
  overflow-wrap:break-word;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#71849a;
  margin-top:30px;
}

.warning{
  margin-top:18px;
  color:#f3c969;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 AI Trading Analyzer</h1>

<div class="subtitle">
Upload a trading chart and analyze the setup
</div>

<div class="card">

<label for="chartInput">Select Chart Image</label>

<input
  id="chartInput"
  type="file"
  accept="image/*"
>

<img id="preview" alt="Chart preview">

<button id="analyzeBtn">
Analyze Chart
</button>

<div id="status"></div>

<div class="warning">
Educational technical analysis only. No profit or trading outcome is guaranteed.
</div>

</div>

<div id="resultCard" class="card hidden">

<h2>🤖 AI Analysis</h2>

<div id="result" class="result"></div>

</div>

<div class="footer">
AI Trading Analyzer • Crypto • Forex • NSE • BSE
</div>

</div>

<script>

const API_URL =
"https://ai-trading-analyzer-api.alirazakhanalirazakhan468.workers.dev/";

const fileInput =
document.getElementById("chartInput");

const preview =
document.getElementById("preview");

const analyzeBtn =
document.getElementById("analyzeBtn");

const statusBox =
document.getElementById("status");

const resultCard =
document.getElementById("resultCard");

const resultBox =
document.getElementById("result");


// Show image preview
fileInput.addEventListener("change", function(){

  const file = fileInput.files[0];

  if(!file){
    preview.style.display="none";
    return;
  }

  if(!file.type.startsWith("image/")){
    statusBox.textContent="Please select an image file.";
    fileInput.value="";
    preview.style.display="none";
    return;
  }

  const url = URL.createObjectURL(file);

  preview.src=url;
  preview.style.display="block";

  statusBox.textContent="Chart selected successfully.";

});


// Analyze chart
analyzeBtn.addEventListener("click", async function(){

  const file = fileInput.files[0];

  if(!file){
    statusBox.textContent="Please select a chart image first.";
    return;
  }

  analyzeBtn.disabled=true;
  analyzeBtn.textContent="Analyzing...";

  statusBox.textContent=
    "🤖 AI is analyzing your chart...";

  resultCard.classList.add("hidden");
  resultBox.textContent="";

  try{

    const formData = new FormData();

    formData.append("image",file);

    const response = await fetch(API_URL,{
      method:"POST",
      body:formData
    });

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        data.message ||
        "Analysis failed."
      );

    }

    resultBox.textContent =
      data.analysis ||
      "AI returned no analysis.";

    resultCard.classList.remove("hidden");

    statusBox.textContent =
      "✅ Chart analyzed successfully.";

    resultCard.scrollIntoView({
      behavior:"smooth"
    });

  }catch(error){

    console.error(error);

    statusBox.textContent =
      "❌ Analysis failed.";

    resultBox.textContent =
      "Error: " + error.message +
      "\n\nPlease try again with a clear chart image.";

    resultCard.classList.remove("hidden");

  }finally{

    analyzeBtn.disabled=false;
    analyzeBtn.textContent="Analyze Chart";

  }

});

</script>

</body>
</html>
